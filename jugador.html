<style>
html.jg{
  --azul:#0B2A5B; --azul-2:#163C7A; --rojo:#C8102E;
  --fondo:#F2F4F8; --sup:#FFFFFF; --sup-2:#E9EDF3; --borde:#D7DDE7;
  --tex:#111A2B; --tex-2:#46516A; --tex-3:#5E6880;
  --bien:#13795B; --bien-f:#E3F4EE; --ojo:#9A5B00; --ojo-f:#FFF3DC; --mal:#B3261E; --mal-f:#FCE8E6;
  --serie:#2457C5; --serie-2:#9FB4E6; --grilla:#E3E7EE;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  html.jg{
    --fondo:#0C111C; --sup:#151C2B; --sup-2:#1F2839; --borde:#2C374D;
    --tex:#EEF1F7; --tex-2:#B9C2D3; --tex-3:#97A1B6;
    --bien:#4CC59A; --bien-f:#123A2E; --ojo:#F0B54A; --ojo-f:#3A2C10; --mal:#FF8A80; --mal-f:#3D1715;
    --serie:#7FA6F5; --serie-2:#3A4F7E; --grilla:#263045;
    color-scheme:dark;
  }
}
body.jg *{box-sizing:border-box}
html.jg, body.jg{margin:0;padding:0}
body.jg{background:var(--fondo);color:var(--tex);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh}
body.jg button{font-family:inherit;font-size:inherit;color:inherit}
body.jg input, body.jg select{font-family:inherit;font-size:16px;color:var(--tex)}
body.jg .oculto{display:none!important}

/* ── cabecera ── */
body.jg .cab{position:sticky;top:0;z-index:20;background:var(--azul);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;gap:10px}
body.jg .cab .escudo{width:34px;height:34px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
body.jg .cab .quien{flex:1;min-width:0}
body.jg .cab .nom{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.jg .cab .div{font-size:12px;opacity:.85}
body.jg .cab .menu{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:9px;width:38px;height:38px;font-size:18px;cursor:pointer}
body.jg .estado{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:8px 16px;background:var(--sup-2);color:var(--tex-2)}
body.jg .estado .punto{width:9px;height:9px;border-radius:50%;background:var(--bien);flex-shrink:0}
body.jg .estado.sin .punto{background:var(--ojo)}
body.jg .estado.pend{background:var(--ojo-f);color:var(--tex)}
body.jg .estado.err{background:var(--mal-f);color:var(--tex)}
body.jg .estado.err .punto{background:var(--mal)}

body.jg main{padding:16px 16px calc(96px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
body.jg h2{font-size:19px;margin:4px 0 12px}
body.jg h3{font-size:15px;margin:22px 0 8px}
body.jg .tarj{background:var(--sup);border:1px solid var(--borde);border-radius:16px;padding:16px;margin-bottom:12px}
body.jg .nota{font-size:12.5px;color:var(--tex-3)}
body.jg .fila{display:flex;align-items:center;gap:10px}
body.jg .crece{flex:1;min-width:0}

/* ── botones ── */
body.jg .btn{display:block;width:100%;padding:15px;border:0;border-radius:13px;font-size:16.5px;font-weight:800;cursor:pointer;text-align:center}
body.jg .btn-1{background:var(--azul);color:#fff}
body.jg .btn-2{background:var(--sup-2);color:var(--tex)}
body.jg .btn-rojo{background:var(--rojo);color:#fff}
body.jg .btn:disabled{opacity:.45;cursor:default}
body.jg .chip{border:1.5px solid var(--borde);background:var(--sup);border-radius:999px;padding:8px 15px;font-weight:700;font-size:14px;cursor:pointer;color:var(--tex-2)}
body.jg .chip.on{background:var(--azul);border-color:var(--azul);color:#fff}
@media (prefers-color-scheme:dark){ body.jg .btn-1, body.jg .chip.on{background:#2F5DB8;border-color:#2F5DB8} }

/* ── Hoy ── */
body.jg .hoy{display:grid;gap:12px}
body.jg .hoy .tarj{display:flex;align-items:center;gap:14px;padding:18px;margin:0}
body.jg .hoy .ico{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;background:var(--sup-2)}
body.jg .hoy .tit{font-weight:800;font-size:16.5px}
body.jg .marca{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;margin-top:3px}
body.jg .marca.ok{color:var(--bien)} body.jg .marca.esp{color:var(--ojo)} body.jg .marca.no{color:var(--tex-3)}
body.jg .hoy .ir{padding:11px 16px;border-radius:11px;border:0;background:var(--azul);color:#fff;font-weight:800;cursor:pointer;flex-shrink:0}
body.jg .hoy .ir.ok{background:var(--sup-2);color:var(--tex)}
@media (prefers-color-scheme:dark){ body.jg .hoy .ir{background:#2F5DB8} body.jg .hoy .ir.ok{background:var(--sup-2)} }

/* ── formularios ── */
body.jg .preg{margin-bottom:20px}
body.jg .preg .lab{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:16px;margin-bottom:8px}
body.jg .preg .val{font-size:15px;color:var(--tex-3);font-weight:700}
body.jg .escala{display:grid;gap:6px}
body.jg .escala button{padding:14px 0;border-radius:11px;border:2px solid var(--borde);background:var(--sup);font-weight:800;font-size:17px;cursor:pointer;color:var(--tex-2)}
body.jg .escala button.on{background:var(--azul);border-color:var(--azul);color:#fff}
@media (prefers-color-scheme:dark){ body.jg .escala button.on{background:#2F5DB8;border-color:#2F5DB8} }
body.jg .extremos{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tex-3);margin-top:4px}
body.jg .borg button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;margin-bottom:7px;border-radius:12px;border:2px solid var(--borde);
  background:var(--sup);cursor:pointer;text-align:left}
body.jg .borg .n{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;flex-shrink:0}
body.jg .borg .d{font-weight:700;color:var(--tex-2);font-size:14.5px}
body.jg .borg button.on{border-color:var(--tex);background:var(--sup-2)}
body.jg .borg button.on .d{color:var(--tex)}
body.jg select.campo, body.jg input.campo{width:100%;padding:13px 12px;border:2px solid var(--borde);border-radius:11px;background:var(--sup);margin-bottom:12px}
body.jg label.mini{display:block;font-weight:700;font-size:13.5px;margin:4px 0 6px;color:var(--tex-2)}
body.jg .listo{text-align:center;padding:30px 10px}
body.jg .listo .grande{font-size:54px}
body.jg .listo h2{margin:10px 0 6px}

/* ── pestañas de abajo ── */
body.jg .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sup);border-top:1px solid var(--borde);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
body.jg .tabs button{flex:1;border:0;background:transparent;padding:6px 2px;border-radius:10px;cursor:pointer;color:var(--tex-3);font-size:11.5px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:2px}
body.jg .tabs button .i{font-size:20px;line-height:1}
body.jg .tabs button.on{color:var(--azul);background:var(--sup-2)}
@media (prefers-color-scheme:dark){ body.jg .tabs button.on{color:#9DBBFF} }

/* ── datos ── */
body.jg .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
body.jg .kpi{background:var(--sup);border:1px solid var(--borde);border-radius:14px;padding:12px 14px}
body.jg .kpi .k{font-size:12px;color:var(--tex-3);font-weight:700}
body.jg .kpi .v{font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
body.jg .kpi .s{font-size:12px;color:var(--tex-3)}
body.jg .grafico{position:relative}
body.jg .grafico svg{display:block;width:100%;height:auto;touch-action:pan-y}
body.jg .tip{position:absolute;top:0;transform:translateX(-50%);background:var(--tex);color:var(--fondo);font-size:12px;font-weight:700;padding:4px 8px;
  border-radius:7px;white-space:nowrap;pointer-events:none}
body.jg .test{padding:14px 16px}
body.jg .test .top{display:flex;align-items:baseline;gap:8px}
body.jg .test .nm{font-weight:800;flex:1;min-width:0}
body.jg .test .ult{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
body.jg .test .u{font-size:12px;color:var(--tex-3);font-weight:700}
body.jg .cambio{font-size:12.5px;font-weight:800;padding:2px 8px;border-radius:999px;display:inline-block}
body.jg .cambio.mejor{background:var(--bien-f);color:var(--bien)} body.jg .cambio.peor{background:var(--mal-f);color:var(--mal)} body.jg .cambio.igual{background:var(--sup-2);color:var(--tex-2)}
body.jg .barra{height:8px;border-radius:4px;background:var(--sup-2);position:relative;margin:10px 0 4px}
body.jg .barra i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--serie)}
body.jg .tabla{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
body.jg .tabla th{text-align:left;font-size:11.5px;color:var(--tex-3);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--borde)}
body.jg .tabla td{padding:7px 4px;border-bottom:1px solid var(--grilla)}
body.jg .tabla td.r, body.jg .tabla th.r{text-align:right}
body.jg .vacio{text-align:center;color:var(--tex-3);padding:30px 16px;font-size:14px}

/* ── ingreso ── */
body.jg .ingreso{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
body.jg .ingreso .logo{width:84px;height:84px;border-radius:22px;background:#fff;border:1px solid var(--borde);margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
body.jg .ingreso h1{text-align:center;font-size:23px;margin:0 0 4px}
body.jg .ingreso p{text-align:center;color:var(--tex-3);margin:0 0 22px;font-size:14px}
body.jg .error{background:var(--mal-f);color:var(--mal);font-weight:700;font-size:13.5px;padding:10px 12px;border-radius:10px;margin-bottom:12px}
body.jg .aviso{background:var(--ojo-f);color:var(--tex);font-size:13.5px;padding:12px 14px;border-radius:12px;margin-bottom:12px}

/* ── menú ── */
body.jg .velo{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
body.jg .hoja{background:var(--sup);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
body.jg .hoja .btn{margin-top:10px}
</style>
</head>

<script type="text/plain" id="jg-codigo">
'use strict';
// ════════════════════════════════════════════════════════════════════════
//  TIGRE · JUGADOR

//  y se manda solo cuando vuelve la conexión.
//  No usa ninguna librería: habla directo con Supabase.
// ════════════════════════════════════════════════════════════════════════
var SB_URL = 'https://jvopjhvchsnhwchcnzun.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2b3BqaHZjaHNuaHdjaGNuenVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MjUxNTAsImV4cCI6MjA5NTQwMTE1MH0.O9RypkGnP66hSk51FXackEUB3algI-QUrOF4BvI6yUk';
var DOMINIO = 'jugadores.tigre';          // usuario sin @ → usuario@jugadores.tigre
var VERSION = 'j1';

var DOLOR_ZONAS = ['Aductor','Cuádriceps','Gemelos','Isquiotibiales','Psoas','Sóleo','Tibial anterior','Otro'];
var DOLOR_TIEMPOS = ['Hoy','1 día','2 días','3 días','4-7 días','Más de 1 semana','Más de 1 mes'];
var BORG = {1:'Muy muy suave',2:'Muy suave',3:'Suave',4:'Moderado',5:'Algo duro',6:'Duro',7:'Muy duro',8:'Muy muy duro',9:'Casi máximo',10:'Máximo esfuerzo'};
var WELL_DEF = {fields:[{key:'sueno',label:'Sueño',max:5},{key:'energia',label:'Energía',max:5},{key:'fisico',label:'Físico',max:5},{key:'emocional',label:'Emocional',max:5}]};
var TESTS_DEF = [{"id":"cmj","name":"CMJ","unit":"cm","better":"up","lat":"bi"},{"id":"sj","name":"Squat Jump","unit":"cm","better":"up","lat":"bi"},{"id":"abk","name":"Abalakov","unit":"cm","better":"up","lat":"bi"},{"id":"cmj_uni","name":"CMJ unilateral","unit":"cm","better":"up","lat":"uni"},{"id":"hop","name":"Salto horizontal","unit":"cm","better":"up","lat":"bi"},{"id":"hop_uni","name":"Single hop distancia","unit":"cm","better":"up","lat":"uni"},{"id":"triple_hop","name":"Triple hop","unit":"cm","better":"up","lat":"uni"},{"id":"spr10","name":"Sprint 10 m","unit":"s","better":"down","lat":"bi"},{"id":"spr30","name":"Sprint 30 m","unit":"s","better":"down","lat":"bi"},{"id":"spr40","name":"Sprint 40 m","unit":"s","better":"down","lat":"bi"},{"id":"cod505","name":"505 (COD)","unit":"s","better":"down","lat":"uni"},{"id":"rm_banca","name":"Press banca (1RM)","unit":"kg","better":"up","lat":"bi"},{"id":"rm_sentadilla","name":"Sentadilla (1RM)","unit":"kg","better":"up","lat":"bi"},{"id":"rm_peso_muerto","name":"Peso muerto (1RM)","unit":"kg","better":"up","lat":"bi"},{"id":"rm_hip_thrust","name":"Hip thrust (1RM)","unit":"kg","better":"up","lat":"bi"},{"id":"imtp","name":"IMTP (pico)","unit":"N","better":"up","lat":"bi"},{"id":"iso_ext","name":"Iso cuádriceps","unit":"N","better":"up","lat":"uni"},{"id":"iso_flex","name":"Iso isquiotibiales","unit":"N","better":"up","lat":"uni"},{"id":"iso_add","name":"Iso aductores","unit":"N","better":"up","lat":"uni"},{"id":"iso_abd","name":"Iso abductores","unit":"N","better":"up","lat":"uni"}];
var RESI_DEF = {"3015":{"short":"30-15 IFT","metricUnit":"km/h"},"yoyoir1":{"short":"Yo-Yo IR1","metricUnit":"m"},"yoyoir2":{"short":"Yo-Yo IR2","metricUnit":"m"},"matsudo":{"short":"Matsudo","metricUnit":"km/h"},"navette":{"short":"Navette","metricUnit":""},"otro":{"short":"Otro","metricUnit":""}};
var ANT = [
  {id:'peso', name:'Peso', unit:'kg', better:'none'},
  {id:'adiposa', name:'Masa adiposa', unit:'%', better:'down'},
  {id:'muscular', name:'Masa muscular', unit:'%', better:'up'},
  {id:'suma6', name:'Suma 6 pliegues', unit:'mm', better:'down'},
  {id:'imo', name:'Índice músculo/óseo', unit:'', better:'up'}
];

// ── Guardado en el celular (si el navegador no deja, se sigue en memoria) ──
var MEM = {};
function lget(k, def){ try{ var v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); }catch(e){ return k in MEM ? MEM[k] : def; } }
function lset(k, v){ MEM[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function ldel(k){ delete MEM[k]; try{ localStorage.removeItem(k); }catch(e){} }

// ── Fechas: SIEMPRE la del celular (no la de Greenwich) ──
function fechaLocal(d){ d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hoy(){ return fechaLocal(); }
function ayer(){ var d = new Date(); d.setDate(d.getDate() - 1); return fechaLocal(d); }
function masDias(f, n){ var d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() + n); return fechaLocal(d); }
var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fCorta(f){ if(!f) return ''; var p = String(f).slice(0, 10).split('-'); return +p[2] + ' ' + MESES[+p[1] - 1]; }
function fLarga(f){ var s = fCorta(f); var p = String(f).slice(0, 4); return p !== String(new Date().getFullYear()) ? s + ' ' + p : s; }
function cuando(f){ return f === hoy() ? 'hoy' : (f === ayer() ? 'ayer' : 'el ' + fCorta(f)); }
function hace(ts){
  if(!ts) return '';
  var m = Math.round((Date.now() - ts) / 60000);
  if(m < 2) return 'recién'; if(m < 60) return 'hace ' + m + ' min';
  var h = Math.round(m / 60); if(h < 24) return 'hace ' + h + ' h';
  var d = Math.round(h / 24); return 'hace ' + d + (d === 1 ? ' día' : ' días');
}
function num(v, dec){ if(v == null || isNaN(v)) return '—'; return Number(v).toLocaleString('es-AR', {minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0}); }
function dec(v, u){ if(v == null || isNaN(v)) return '—'; var a = Math.abs(v); var d = u === 's' ? 2 : (a < 20 ? 2 : (a < 200 ? 1 : 0)); return num(v, d); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function aNum(v){ if(v == null || v === '') return null; var n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; }

// ════════════════════════════════════════════════════════════════════════
//  SESIÓN
// ════════════════════════════════════════════════════════════════════════
var SES = lget('jug_sesion', null);     // {access_token, refresh_token, expires_at, uid, email}
var refrescando = null;

function SinRed(msg){ this.message = msg || 'Sin conexión'; this.sinRed = true; }
function ErrorBase(msg, st){ this.message = msg; this.status = st; }

function pedir(ruta, cuerpo, token){
  var h = {'apikey': SB_KEY, 'Content-Type': 'application/json'};
  if(token) h['Authorization'] = 'Bearer ' + token;
  return fetch(SB_URL + ruta, {method: 'POST', headers: h, body: JSON.stringify(cuerpo || {})})
    .catch(function(){ throw new SinRed(); })
    .then(function(r){
      return r.text().then(function(t){
        var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
        if(!r.ok){
          var m = (j && (j.message || j.msg || j.error_description || j.error)) || ('Error ' + r.status);
          throw new ErrorBase(m, r.status);
        }
        return j;
      });
    });
}
function guardarSesion(j){
  SES = {access_token: j.access_token, refresh_token: j.refresh_token,
         expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600),
         uid: j.user ? j.user.id : (SES && SES.uid), email: j.user ? j.user.email : (SES && SES.email),
         user: j.user || (SES && SES.user) || null};
  lset('jug_sesion', SES);
}
function ingresar(usuario, clave){
  var u = String(usuario || '').trim().toLowerCase();
  var email = u.indexOf('@') >= 0 ? u : u + '@' + DOMINIO;
  return pedir('/auth/v1/token?grant_type=password', {email: email, password: clave}).then(guardarSesion);
}
// Un token vigente. Si venció, se renueva (una sola vez aunque lo pidan varios).
function sesionGuardada(){
  // Otra pestaña (o la app instalada) pudo haber renovado la sesión: se usa esa
  var g = lget('jug_sesion', null);
  if(g && SES && g.uid === SES.uid && g.refresh_token && g.refresh_token !== SES.refresh_token && !g.vencida){ SES = g; return true; }
  return false;
}
window.addEventListener('storage', function(e){ if(e.key === 'jug_sesion') sesionGuardada(); });
function token(forzar){
  if(!SES) return Promise.reject(new ErrorBase('Sin sesión', 401));
  sesionGuardada();
  if(!forzar && SES.expires_at - 90 > Date.now() / 1000) return Promise.resolve(SES.access_token);
  if(refrescando) return refrescando;
  var usado = SES.refresh_token;
  refrescando = pedir('/auth/v1/token?grant_type=refresh_token', {refresh_token: usado})
    .then(function(j){ guardarSesion(j); refrescando = null; return SES.access_token; },
          function(e){ refrescando = null;
            if(!e.sinRed && (e.status === 400 || e.status === 401)){
              // Si mientras tanto otra pestaña la renovó, no está vencida: se usa esa
              var g = lget('jug_sesion', null);
              if(g && SES && g.uid === SES.uid && g.refresh_token !== usado && !g.vencida){ SES = g; return SES.access_token; }
              sesionVencida();
              var v = new ErrorBase('Tu sesión venció', 401); v.auth = true; throw v;
            }
            throw e; });

}
function rpc(fn, args, reintento){
  return token().then(function(t){ return pedir('/rest/v1/rpc/' + fn, args || {}, t); })
    .catch(function(e){
      if(!reintento && e.status === 401 && !e.auth && SES && !SES.vencida){ return token(true).then(function(){ return rpc(fn, args, true); }); }
      throw e;
    });
}
function sesionVencida(){
  // Se pide entrar de nuevo, pero lo guardado en el celular NO se pierde
  if(SES){ SES.vencida = true; lset('jug_sesion', SES); }
  render();
}
function salir(){
  // Lo de esta cuenta no queda en el celular (salvo respuestas sin mandar, que
  // esperan a que vuelva a entrar)
  if(SES){
    ldel(claveDatos()); ldel('jug_layout_w_' + SES.uid); ldel('jug_nojug_' + SES.uid);
    var r = lget('jug_respondido', {}), u = SES.uid + '|';
    Object.keys(r).forEach(function(k){ if(k.indexOf(u) === 0) delete r[k]; }); lset('jug_respondido', r);
  }
  try{ if(SES && SES.access_token && enLinea()) fetch(SB_URL + '/auth/v1/logout?scope=local', {method: 'POST', headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + SES.access_token}}).catch(function(){}); }catch(e){}
  ldel('jug_sesion'); SES = null; DATOS = null; DATOS_TS = 0; NO_JUG = false; errorDatos = ''; render();
}

// ════════════════════════════════════════════════════════════════════════
//  COLA: lo respondido espera acá hasta que se pueda mandar
// ════════════════════════════════════════════════════════════════════════
function cola(){ return lget('jug_cola', []); }
function miCola(){ return cola().filter(function(x){ return SES && x.uid === SES.uid; }); }
function encolar(tipo, fecha, datos){
  var c = cola().filter(function(x){ return !(x.uid === SES.uid && x.tipo === tipo && x.fecha === fecha); });   // queda la última
  c.push({id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), uid: SES.uid, tipo: tipo, fecha: fecha, datos: datos, creado: Date.now()});
  lset('jug_cola', c);
  // Se marca como respondido enseguida (para verlo aunque no haya señal)
  var r = lget('jug_respondido', {}); r[SES.uid + '|' + tipo + '|' + fecha] = {datos: datos, ts: Date.now()}; lset('jug_respondido', r);
}
var enviando = null, ultimoError = '';
var otraVez = false;
function enviarCola(){
  if(enviando){ otraVez = true; return enviando; }
  if(!SES || SES.vencida) return Promise.resolve();
  var pend = miCola();
  if(!pend.length){ ultimoError = ''; return Promise.resolve(); }
  enviando = pend.reduce(function(p, it){
    return p.then(function(){
      var llamada = it.tipo === 'wellness'
        ? rpc('jugador_wellness', {p_fecha: it.fecha, p_campos: it.datos.campos, p_dolor: !!it.datos.dolor, p_zona: it.datos.zona || null, p_tiempo: it.datos.tiempo || null})
        : rpc('jugador_pse', {p_fecha: it.fecha, p_pse: it.datos.pse});
      return llamada.then(function(){ sacar(it.id); ultimoError = ''; }, function(e){
        // Sólo se descarta lo que la base rechazó por su contenido (por ejemplo,
        // más de 7 días atrás). Sin señal, sesión vencida, base sin actualizar
        // o cualquier otra cosa: queda guardado y se reintenta.
        if(e.sinRed || e.auth || e.status !== 400) throw e;
        sacar(it.id);
        var rr = lget('jug_respondido', {}); delete rr[it.uid + '|' + it.tipo + '|' + it.fecha]; lset('jug_respondido', rr);
        var rech = lget('jug_rechazados', []); rech.push({tipo: it.tipo, fecha: it.fecha, motivo: e.message, uid: it.uid}); lset('jug_rechazados', rech.slice(-10));
      });
    });
  }, Promise.resolve()).then(function(){
    enviando = null; actualizarEstado();
    if(otraVez){ otraVez = false; if(miCola().length) return enviarCola(); }
    return cargarDatos(true);
  }, function(e){
    enviando = null; otraVez = false; ultimoError = e.sinRed ? '' : (e.message || ''); actualizarEstado();
  });
  return enviando;
}
function sacar(id){ lset('jug_cola', cola().filter(function(x){ return x.id !== id; })); }

//  DATOS DEL JUGADOR (quedan guardados para verlos sin señal)
// ════════════════════════════════════════════════════════════════════════
var DATOS = null, DATOS_TS = 0, cargando = false, errorDatos = '', NO_JUG = false;
function claveDatos(){ return 'jug_datos_' + (SES ? SES.uid : ''); }
function leerGuardados(){
  var g = lget(claveDatos(), null); DATOS = g ? g.d : null; DATOS_TS = g ? g.ts : 0;
  NO_JUG = SES ? lget('jug_nojug_' + SES.uid, false) : false;
}
function cargarDatos(silencioso){
  if(!SES || SES.vencida) return Promise.resolve();
  cargando = true; if(!silencioso) actualizarEstado();
  return rpc('jugador_mis_datos', {p_dias: 180}).then(function(d){
    DATOS = d; DATOS_TS = Date.now(); errorDatos = ''; cargando = false;
    if(NO_JUG){ NO_JUG = false; ldel('jug_nojug_' + SES.uid); }
    lset(claveDatos(), {d: d, ts: DATOS_TS});
    render();
  }, function(e){
    cargando = false;
    // Una cuenta del cuerpo técnico (o sin jugador asignado) entró a la app de jugadores
    if(!e.sinRed && /no est[aá] vinculada/i.test(e.message || '')){
      // ¿Es una cuenta de jugador sin perfil, o una cuenta del cuerpo técnico?
      miRol().then(function(rol){
        NO_JUG = rol === 'jugador' ? 'sin_perfil' : true;
        lset('jug_nojug_' + SES.uid, NO_JUG); render();
      });
      return;
    }
    else if(!e.sinRed) errorDatos = e.message || 'No se pudieron leer tus datos.';
    render();
  });
}
// El rol de la cuenta (cada uno sólo puede leer su propia fila de usuarios)
function miRol(){
  return token().then(function(t){
    return fetch(SB_URL + '/rest/v1/usuarios?select=rol&auth_uid=eq.' + encodeURIComponent(SES.uid), {headers: {'apikey': SB_KEY, 'Authorization': 'Bearer ' + t}});
  }).then(function(r){ return r.ok ? r.json() : []; }).then(function(a){ return (a && a[0] && a[0].rol) || ''; }, function(){ return ''; });
}
function enLinea(){ return navigator.onLine !== false; }

// Lo respondido, sumando lo de la nube y lo que está en el celular
function respondido(tipo, fecha){
  var enCola = miCola().some(function(x){ return x.tipo === tipo && x.fecha === fecha; });
  if(enCola) return 'esperando';
  var lista = DATOS ? (tipo === 'wellness' ? DATOS.wellness : DATOS.pse) || [] : [];
  if(lista.some(function(x){ return String(x.date).slice(0, 10) === fecha; })) return 'ok';
  var r = lget('jug_respondido', {})[(SES && SES.uid) + '|' + tipo + '|' + fecha];
  if(r && Date.now() - r.ts < 36e5 * 48) return 'ok';
  return '';
}

function escudo(alto){ return '<img src="' + ESCUDO_SRC + '" alt="Escudo de Tigre" style="height:' + alto + 'px;width:auto;display:block">'; }
var ESCUDO = escudo(28);

function render(){
  if(!SES || SES.vencida){ app.innerHTML = htmlIngreso(); return; }
  if(NO_JUG === 'sin_perfil'){ app.innerHTML = htmlSinPerfil(); return; }
  if(NO_JUG){ app.innerHTML = htmlNoJugador(); return; }
  var yo = DATOS && DATOS.yo;
  var h = '<header class="cab"><div class="escudo">' + ESCUDO + '</div><div class="quien"><div class="nom">' + esc(yo ? yo.nombre : (SES.email || '')) + '</div>'
    + '<div class="div">' + esc(yo ? yo.categoria + (yo.pos ? ' · ' + yo.pos : '') : 'Club Atlético Tigre') + '</div></div>'
    + '<button class="menu" aria-label="Menú" onclick="abrirMenu()">☰</button></header>'
    + '<div id="estado"></div><main id="vista">';
  if(FORM) h += FORM.tipo === 'wellness' ? htmlWellness() : htmlPse();
  else if(!DATOS && !DATOS_TS && enLinea() && !errorDatos) h += '<div class="vacio">Cargando…</div>';
  else if(VISTA === 'hoy') h += htmlHoy();
  else if(!DATOS) h += errorDatos ? '<div class="aviso">' + esc(errorDatos) + '</div>' : '<div class="vacio">' + (enLinea() ? 'Cargando tus datos…' : 'Sin conexión. Tus datos aparecen la primera vez que entres con señal.') + '</div>';
  else if(VISTA === 'bienestar') h += htmlBienestar();
  else if(VISTA === 'tests') h += htmlTests();
  else if(VISTA === 'partidos') h += htmlPartidos();
  else if(VISTA === 'cuerpo') h += htmlCuerpo();
  h += '</main>';
  if(!FORM) h += '<nav class="tabs">' + [['hoy','🏠','Hoy'],['bienestar','💚','Bienestar'],['tests','📈','Tests'],['partidos','⚽','Partidos'],['cuerpo','📏','Cuerpo']].map(function(t){
      return '<button class="' + (VISTA === t[0] ? 'on' : '') + '" onclick="irA(\'' + t[0] + '\')"><span class="i">' + t[1] + '</span>' + t[2] + '</button>'; }).join('') + '</nav>';
  app.innerHTML = h;
  actualizarEstado();
  activarGraficos();
}
function irA(v){ VISTA = v; FORM = null; window.scrollTo(0, 0); render(); }

function actualizarEstado(){
  var el = document.getElementById('estado'); if(!el) return;
  var n = SES ? miCola().length : 0, cl = 'estado', t;
  var rech = lget('jug_rechazados', []).filter(function(x){ return SES && x.uid === SES.uid; });
  if(n){ cl += ' pend' + (enLinea() ? '' : ' sin');
    t = n === 1 ? '1 respuesta guardada en el celular' : n + ' respuestas guardadas en el celular';
    t += enLinea() ? (enviando ? ' · enviando…' : (ultimoError ? ' · ' + esc(ultimoError) : ' · se manda en un momento')) : ' · se manda sola cuando tengas señal'; }
  else if(rech.length){ cl += ' err'; t = 'No se pudo guardar tu ' + (rech[rech.length - 1].tipo === 'pse' ? 'PSE' : 'wellness') + ' del ' + esc(fCorta(rech[rech.length - 1].fecha)) + ': ' + esc(rech[rech.length - 1].motivo)
    + ' <button onclick="lset(\'jug_rechazados\',[]);actualizarEstado()" style="margin-left:auto;border:0;background:transparent;font-weight:800;cursor:pointer;color:inherit">✕</button>'; }
  else if(!enLinea()){ cl += ' sin'; t = 'Sin conexión · podés responder igual'; }
  else if(cargando){ t = 'Actualizando…'; }
  else { t = DATOS_TS ? 'Todo enviado · datos ' + hace(DATOS_TS) : 'Conectado'; }
  el.className = cl; el.innerHTML = '<span class="punto"></span><span style="flex:1;display:flex;align-items:center">' + t + '</span>';
}

// ── Cuenta que no es de jugador ──
function htmlNoJugador(){
  return '<div class="ingreso"><div class="logo">' + escudo(64) + '</div>'
    + '<h1>Esta es la app de los jugadores</h1>'
    + '<p>Entraste con <b>' + esc(SES.email || '') + '</b>, que no es una cuenta de jugador. Si sos del cuerpo técnico, la coordinación o un área del club, tu lugar es el dashboard.</p>'
    + '<button class="btn btn-1" onclick="irAlDashboard()">Ir al dashboard</button>'
    + '<button class="btn btn-2" style="margin-top:10px" onclick="salir()">Cerrar sesión y entrar con otra cuenta</button>'
    + '<p class="nota" style="margin-top:18px">Si sos jugador y ves esto, pedile a tu preparador físico que vincule tu cuenta con tu perfil.</p></div>';
}

function htmlSinPerfil(){
  return '<div class="ingreso"><div class="logo">' + escudo(64) + '</div>'
    + '<h1>Tu cuenta todavía no está lista</h1>'
    + '<p>Entraste bien con <b>' + esc(SES.email || '') + '</b>, pero tu cuenta no tiene un jugador asignado (o tu perfil cambió). Avisale a tu preparador físico para que lo arregle.</p>'
    + '<button class="btn btn-2" onclick="NO_JUG=false;ldel(\'jug_nojug_\'+SES.uid);cargarDatos()">Probar de nuevo</button>'
    + '<button class="btn btn-2" style="margin-top:10px" onclick="salir()">Cerrar sesión</button></div>';
}

// Pasarle la sesión al dashboard (así no vuelve a poner la contraseña) e ir ahí
function irAlDashboard(){
  try{
    if(SES && SES.user && SES.refresh_token){
      var ref = new URL(SB_URL).hostname.split('.')[0];
      localStorage.setItem('sb-' + ref + '-auth-token', JSON.stringify({
        access_token: SES.access_token, token_type: 'bearer', expires_in: Math.max(0, SES.expires_at - Math.floor(Date.now() / 1000)),
        expires_at: SES.expires_at, refresh_token: SES.refresh_token, user: SES.user}));
      // La app suelta la sesión (si la usaran los dos, al renovarla uno dejaría al otro afuera)
      ldel('jug_sesion'); ldel('jug_nojug_' + SES.uid);
    }
  }catch(e){}
  location.href = 'index.html';
}

// ── Ingreso ──
function htmlIngreso(){
  var venc = SES && SES.vencida;
  var pend = venc ? cola().filter(function(x){ return x.uid === SES.uid; }).length : 0;
  return '<div class="ingreso"><div class="logo">' + escudo(64) + '</div>'
    + '<h1>Club Atlético Tigre</h1><p>Entrá con el usuario y la contraseña que te dio tu preparador físico.</p>'
    + (venc ? '<div class="aviso">Tu sesión venció: entrá de nuevo.' + (pend ? ' Tenés ' + pend + ' respuesta(s) guardadas que se mandan apenas entres.' : '') + '</div>' : '')
    + '<div id="ing-err"></div>'
    + '<form onsubmit="event.preventDefault();hacerIngreso()">'
    + '<label class="mini" for="ing-u">Mail o usuario</label><input class="campo" id="ing-u" autocomplete="username" autocapitalize="none" spellcheck="false" value="' + esc(venc ? (SES.email || '') : '') + '">'
    + '<label class="mini" for="ing-c">Contraseña</label><input class="campo" id="ing-c" type="password" autocomplete="current-password">'
    + '<button class="btn btn-1" id="ing-b" type="submit" style="margin-top:6px">Entrar</button></form>'
    + '<p class="nota" style="margin-top:18px">¿Te olvidaste la contraseña? Pedile una nueva a tu preparador físico.</p></div>';
}
function hacerIngreso(){
  var u = document.getElementById('ing-u').value, c = document.getElementById('ing-c').value, b = document.getElementById('ing-b'), err = document.getElementById('ing-err');
  if(!u || !c){ err.innerHTML = '<div class="error">Completá usuario y contraseña.</div>'; return; }
  b.disabled = true; b.textContent = 'Entrando…'; err.innerHTML = '';
  var antes = SES && SES.uid;
  ingresar(u, c).then(function(){
    errorDatos = '';
    leerGuardados(); VISTA = 'hoy'; FORM = null; render();

// Gráfico de una serie: puntos o barras por día, con toque para ver el valor
var GRAF = [];
// Posición horizontal: puntos de borde a borde; barras, cada una en su franja
function posX(barras, n, i){
  var pl = 30, ancho = 340 - 30 - 8;
  if(barras) return pl + (i + 0.5) * ancho / n;
  return pl + (n === 1 ? ancho / 2 : i * ancho / (n - 1));
}
function grafico(dias, vals, o){
  o = o || {}; var id = GRAF.length; GRAF.push({dias: dias, vals: vals, o: o});
  var W = 340, H = o.alto || 150, pl = 30, pr = 8, pt = 22, pb = 22, n = dias.length;
  var vs = vals.filter(function(v){ return v != null; });
  if(!vs.length) return '<div class="vacio" style="padding:18px">Todavía no hay datos en este período.</div>';
  var mn = o.min != null ? o.min : Math.min.apply(null, vs), mx = o.max != null ? o.max : Math.max.apply(null, vs);
  if(mx === mn){ mx += 1; mn -= 1; }
  var X = function(i){ return posX(o.barras, n, i); };
  var Y = function(v){ return pt + (1 - (v - mn) / (mx - mn)) * (H - pt - pb); };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.titulo || '') + '">';
  (o.marcas || [mn, (mn + mx) / 2, mx]).forEach(function(v){
    s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--grilla)" stroke-width="1"/>'
      + '<text x="' + (pl - 5) + '" y="' + (Y(v) + 3.5) + '" font-size="10" text-anchor="end" fill="var(--tex-3)">' + num(v) + '</text>'; });
  [0, Math.floor((n - 1) / 2), n - 1].forEach(function(i){
    s += '<text x="' + X(i) + '" y="' + (H - 6) + '" font-size="10" text-anchor="' + (i === 0 ? 'start' : (i === n - 1 ? 'end' : 'middle')) + '" fill="var(--tex-3)">' + fLarga(dias[i]) + '</text>'; });
  if(o.barras){
    var bw = Math.max(3, Math.min(28, (W - pl - pr) / n - 3));
    vals.forEach(function(v, i){ if(v == null) return; var y = Y(v), y0 = Y(mn);
      s += '<path d="M' + (X(i) - bw / 2) + ' ' + y0 + ' V' + (y + 3) + ' q0 -3 3 -3 h' + (bw - 6) + ' q3 0 3 3 V' + y0 + 'Z" fill="var(--serie)"/>'; });
  } else {
    var d = '', prev = false;
    vals.forEach(function(v, i){ if(v == null){ prev = false; return; } d += (prev ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; prev = true; });
    s += '<path d="' + d + '" fill="none" stroke="var(--serie)" stroke-width="2" stroke-linejoin="round"/>';
    vals.forEach(function(v, i){ if(v == null) return; s += '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="4" fill="var(--serie)" stroke="var(--sup)" stroke-width="2"/>'; });
  }
  s += '<line class="cruz" x1="0" x2="0" y1="' + pt + '" y2="' + (H - pb) + '" stroke="var(--tex-3)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>';
  s += '<rect x="' + pl + '" y="0" width="' + (W - pl - pr) + '" height="' + H + '" fill="transparent" data-g="' + id + '"/></svg>';
  return '<div class="grafico">' + s + '<div class="tip" style="display:none"></div></div>';
}
function activarGraficos(){
  document.querySelectorAll('.grafico rect[data-g]').forEach(function(r){
    var g = GRAF[+r.getAttribute('data-g')]; if(!g) return;
    var cont = r.closest('.grafico'), svg = cont.querySelector('svg'), tip = cont.querySelector('.tip'), cruz = svg.querySelector('.cruz');
    function mostrar(ev){
      var b = svg.getBoundingClientRect(), x = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - b.left) / b.width * 340;
      var n = g.dias.length, best = -1, bd = 1e9;
      for(var i = 0; i < n; i++){ if(g.vals[i] == null) continue; var dd = Math.abs(posX(g.o.barras, n, i) - x); if(dd < bd){ bd = dd; best = i; } }
      if(best < 0) return;
      var xi = posX(g.o.barras, n, best);
      cruz.setAttribute('x1', xi); cruz.setAttribute('x2', xi); cruz.style.display = '';
      tip.style.display = ''; tip.style.left = Math.max(12, Math.min(88, xi / 340 * 100)) + '%';
      tip.textContent = fCorta(g.dias[best]) + ': ' + (g.o.fmt ? g.o.fmt(g.vals[best]) : num(g.vals[best]));
    }
    r.addEventListener('pointerdown', mostrar); r.addEventListener('pointermove', mostrar);
    r.addEventListener('pointerleave', function(){ tip.style.display = 'none'; cruz.style.display = 'none'; });
  });
}

  var ids = Object.keys(por);
  if(!ids.length) return '<h2>Mis tests</h2><div class="vacio">Todavía no tenés tests cargados.</div>';
  ids.sort(function(a, b){ var la = por[a].reduce(function(m, r){ return r.date > m ? r.date : m; }, ''), lb = por[b].reduce(function(m, r){ return r.date > m ? r.date : m; }, ''); return lb.localeCompare(la); });
  var h = '<h2>Mis tests</h2>';
  ids.forEach(function(id){
    var t = cat[id] || {name: id, unit: '', better: 'up'}, l = por[id].sort(function(a, b){ return a.date.localeCompare(b.date); });
    var u = l[l.length - 1], prev = l.length > 1 ? l[l.length - 2] : null;
    h += '<div class="tarj test"><div class="top"><div class="nm">' + esc(t.name) + '</div><div class="ult">' + dec(u.v, t.unit) + '</div><div class="u">' + esc(t.unit || '') + '</div></div>'
      + '<div class="fila" style="margin-top:4px;flex-wrap:wrap;gap:6px"><span class="nota">' + fLarga(u.date) + (u.div && DATOS.yo && u.div !== DATOS.yo.categoria ? ' · ' + esc(u.div) : '') + '</span>'
      + (prev ? cambioHtml(u.v - prev.v, t.better, t.unit) + '<span class="nota">vs. ' + fLarga(prev.date) + '</span>' : '') + '</div>';
    if(u.I != null && u.D != null) h += '<div class="nota" style="margin-top:4px">Izquierda ' + dec(u.I, t.unit) + ' · Derecha ' + dec(u.D, t.unit)
      + ' · diferencia ' + num(Math.abs(u.I - u.D) / Math.max(u.I, u.D) * 100) + ' %</div>';
    // Dónde estás en tu plantel (sin nombres)
    var pl = (DATOS.tests_plantel || {})[id];
    if(Array.isArray(pl) && pl.length >= 4 && t.better !== 'none' && u.div === (DATOS.yo && DATOS.yo.categoria)){
      var otros = pl.length - 1, mejor = pl.filter(function(v){ return t.better === 'down' ? v > u.v : v < u.v; }).length;
      mejor = Math.min(mejor, otros);
      h += '<div class="barra" role="img" aria-label="Superás a ' + mejor + ' de ' + otros + '"><i style="width:' + Math.max(3, mejor / otros * 100) + '%"></i></div>'
        + '<div class="nota">Superás a <b>' + mejor + '</b> de tus ' + otros + ' compañeros con este test · promedio del plantel ' + dec(media(pl), t.unit) + '</div>';
    }
    if(l.length >= 3) h += '<div style="margin-top:8px">' + grafico(l.map(function(r){ return r.date; }), l.map(function(r){ return r.v; }), {alto: 110, titulo: t.name, fmt: function(v){ return dec(v, t.unit) + ' ' + (t.unit || ''); }}) + '</div>';
    h += '</div>';
  });
  return h;
}

function htmlPartidos(){
  var ps = (DATOS.partidos || []).filter(function(p){ return p.yo; }).slice().reverse();
  if(!ps.length) return '<h2>Mis partidos</h2><div class="vacio">Todavía no hay partidos con tu GPS.</div>';
  var h = '<h2>Mis partidos</h2><div class="nota" style="margin:-6px 0 12px">Tus números y el promedio del equipo, llevados a 90 minutos (jugadores con 45′ o más).</div>';
  ps.forEach(function(p){
    var y = p.yo, e = p.equipo || {}, mi = aNum(y.min), f = mi > 0 ? 90 / mi : null;
    var fila = function(nom, v, v90, eq, u, d){
      return '<tr><td>' + nom + '</td><td class="r"><b>' + (v == null ? '—' : num(v, d || 0)) + '</b></td><td class="r">' + (v90 == null ? '—' : num(v90, d || 0)) + '</td><td class="r">' + (eq == null ? '—' : num(eq, d || 0)) + '</td></tr>';
    };
    var g = function(k){ return aNum(y[k]); };
    var ad = (g('acc') != null || g('dcc') != null) ? (g('acc') || 0) + (g('dcc') || 0) : null;
    var p90 = function(v){ return v != null && f && mi >= 30 ? v * f : null; };
    h += '<div class="tarj"><div class="fila"><div class="crece"><div style="font-weight:800;font-size:16px">vs ' + esc(p.rival || '—') + '</div>'
      + '<div class="nota">' + fLarga(p.fecha) + (p.comp ? ' · ' + esc(p.comp) : '') + (p.result ? ' · ' + esc(p.result) : '') + '</div></div>'
      + '<div style="text-align:right"><div style="font-size:22px;font-weight:800">' + (mi == null ? '—' : num(mi)) + '′</div><div class="nota">jugados</div></div></div>'
      + '<table class="tabla" style="margin-top:8px"><tr><th></th><th class="r">Vos</th><th class="r">Vos /90′</th><th class="r">Equipo /90′</th></tr>'
      + fila('Distancia (m)', g('mts'), p90(g('mts')), aNum(e.mts90))
      + fila('HSR (m)', g('hsr'), p90(g('hsr')), aNum(e.hsr90))
      + fila('Sprint (m)', g('spr'), p90(g('spr')), aNum(e.spr90))
      + fila('Acel + desacel', ad, p90(ad), aNum(e.ad90))
      + '<tr><td>Vel. máxima (km/h)</td><td class="r"><b>' + num(g('vmax'), 1) + '</b></td><td class="r">—</td><td class="r">' + num(aNum(e.vmax), 1) + '</td></tr>'
      + '</table>' + (mi != null && mi < 30 ? '<div class="nota" style="margin-top:6px">Con menos de 30′ no se lleva a 90 (daría números engañosos).</div>' : '') + '</div>';
  });
  return h;
}

function htmlCuerpo(){
  GRAF = [];
  var rs = (Array.isArray(DATOS.antropometria) ? DATOS.antropometria : []).filter(function(r){ return r && r.date; })
    .sort(function(a, b){ return String(a.date).localeCompare(String(b.date)); });
  if(!rs.length) return '<h2>Mi cuerpo</h2><div class="vacio">Todavía no tenés mediciones de antropometría.</div>';
  var u = rs[rs.length - 1], p = rs.length > 1 ? rs[rs.length - 2] : null;
  var h = '<h2>Mi cuerpo</h2><div class="nota" style="margin:-6px 0 12px">Última medición: ' + fLarga(u.date) + (p ? ' · comparada con ' + fLarga(p.date) : '') + '</div><div class="kpis">';
  ANT.forEach(function(m){
    var v = aNum(u[m.id]); if(v == null) return;
    var pv = p ? aNum(p[m.id]) : null;
    h += '<div class="kpi"><div class="k">' + m.name + '</div><div class="v">' + dec(v, m.unit) + '<span class="u" style="font-size:13px;color:var(--tex-3)"> ' + m.unit + '</span></div>'
      + (pv != null ? '<div style="margin-top:3px">' + cambioHtml(v - pv, m.better, m.unit) + '</div>' : '') + '</div>';
  });
  h += '</div>';
  if(rs.length >= 2) ANT.forEach(function(m){
    var l = rs.filter(function(r){ return aNum(r[m.id]) != null; }); if(l.length < 2) return;
    h += '<div class="tarj"><div style="font-weight:800;margin-bottom:6px">' + m.name + (m.unit ? ' (' + m.unit + ')' : '') + '</div>'
      + grafico(l.map(function(r){ return String(r.date).slice(0, 10); }), l.map(function(r){ return aNum(r[m.id]); }), {alto: 110, titulo: m.name, fmt: function(v){ return dec(v, m.unit) + ' ' + m.unit; }}) + '</div>';
  });
  return h + '<div class="nota">Las mediciones las carga el área de nutrición. Consultá con ellos cualquier duda.</div>';
}
